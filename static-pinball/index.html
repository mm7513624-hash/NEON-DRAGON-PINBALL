<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Neon Dragon Pinball</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="cabinet">
        <header class="hud">
          <div class="hud-brand">
            <img src="logo-dragon.jpg" alt="" class="hud-logo" />
            <div>
              <p class="hud-kicker">Arcade</p>
              <h1>Neon Dragon Pinball</h1>
            </div>
          </div>
          <div class="hud-stats">
            <div class="stat ball">
              <span>Bola</span>
              <strong id="stat-balls">3</strong>
            </div>
            <div class="stat score">
              <span>Puntos</span>
              <strong id="stat-score">0</strong>
              <em id="stat-record">Récord 0</em>
            </div>
            <div class="stat">
              <span>Mult</span>
              <strong id="stat-mult">x1</strong>
            </div>
            <div class="stat">
              <span>Combo</span>
              <strong id="stat-combo">0</strong>
            </div>
          </div>
          <p class="hud-status" id="hud-status">TOCA PARA JUGAR</p>
        </header>

        <div class="table-wrap">
          <canvas id="table" class="table" width="500" height="860" aria-label="Mesa de pinball Neon Dragon"></canvas>
          <button type="button" id="start-gate" class="start-gate">
            <img src="logo-dragon.jpg" alt="" />
            <span>Toca para jugar</span>
            <small>Paletas Z / ← y / / → · Espacio lanza</small>
          </button>
        </div>

        <div class="controls">
          <div class="row main-row">
            <button type="button" id="btn-left" class="btn flip left" aria-label="Paleta izquierda">Paleta</button>
            <button type="button" id="btn-launch" class="btn launch" aria-label="Lanzar bola">Lanzar</button>
            <button type="button" id="btn-right" class="btn flip right" aria-label="Paleta derecha">Paleta</button>
          </div>
          <div class="row sub-row">
            <button type="button" id="btn-pause" class="btn ghost">Pausa</button>
            <button type="button" id="btn-auto" class="btn ghost">Auto</button>
            <button type="button" id="btn-speed" class="btn ghost">x1</button>
            <button type="button" id="btn-nudge" class="btn ghost">Empujar 3</button>
            <button type="button" id="btn-mute" class="btn ghost">Silencio</button>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
